[package]
name = "lcd-odroid"
version = "0.1.0"
edition = "2024"

[dependencies]
hd44780-driver = "0.4"
i2cdev = "0.6"
embedded-hal = "0.2"
ureq = { version = "3", default-features = false, features = ["json"] }
base64 = { version = "0.23", default-features = false }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml = "1.1"
